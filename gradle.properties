# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build speed.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is required by this project (the book's android.support.*
# libraries were replaced by their modern AndroidX equivalents).
android.useAndroidX=true

# Kotlin is not used in this project (Java only).
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
