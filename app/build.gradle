apply plugin: 'com.android.application'

android {
    namespace 'com.pedrou.cannongame'

    // compileSdk 37 is the platform installed with the Android Studio used for
    // this project. The game only uses long-standing APIs, so the compiled
    // code is not tied to any recent platform feature.
    compileSdk 37

    defaultConfig {
        applicationId "com.pedrou.cannongame"
        // Android 7.0 Nougat. The chapter's immersive-mode APIs are all
        // available from here on, and virtual devices start at this level.
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.core:core:1.13.1'
}
